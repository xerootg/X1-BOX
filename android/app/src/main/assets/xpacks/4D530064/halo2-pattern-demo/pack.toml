# Halo 2 — pattern_bytes mechanism demo
#
# Functionally equivalent to halo2-60hz-tick-demo, but applied via pattern
# anchoring instead of a hard-coded address. Useful as a template for
# authoring tag/map overlays where the patch target lives at a runtime-
# variable address but has a stable internal signature.
#
# How it works:
#   1. Scanner walks the xbe .rdata range (search_start..search_end).
#   2. At each address it tries to match `search_pattern`; '??' is wildcard.
#   3. On the first match, it adds `search_offset` and verifies `expected`.
#   4. If both match, `replace` is written. The patch is one-shot per boot.
#
# The 12-byte anchor here is the contiguous engine-tunable triplet
# {8388608.0f, 1/3, 0.1f} that immediately precedes the seconds_per_tick
# value at 0x0045DC6C — unique within the restricted search range.

schema = 1
name = "Halo 2 — pattern-bytes demo (60 Hz tick via signature)"
author = "x1-box"
description = "Same effect as halo2-60hz-tick-demo, applied by pattern match. Game runs 2x speed."

[match]
title_id = 0x4D530064

[[patch]]
kind = "pattern_bytes"
description = "anchor on {8388608, 1/3, 0.1}; patch seconds_per_tick at +12"
search_start   = 0x0045D000
search_end     = 0x0045E000
search_pattern = "4B 00 00 00 AB AA AA 3E CD CC CC 3D"
search_offset  = 12
expected       = "89 88 08 3D"
replace        = "89 88 88 3C"
